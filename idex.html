<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Island 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block}

#crosshair{
 position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
 width:22px;height:22px;z-index:10;pointer-events:none
}
#crosshair:before,#crosshair:after{
 content:"";position:absolute;background:white;box-shadow:0 0 3px #000
}
#crosshair:before{width:22px;height:2px;top:10px;left:0}
#crosshair:after{width:2px;height:22px;left:10px;top:0}

#hud{
 position:fixed;left:18px;bottom:18px;color:white;z-index:20;
 text-shadow:2px 2px 3px #000;pointer-events:none
}
.bar{
 width:260px;height:22px;background:#222;border:2px solid white;
 border-radius:5px;margin-top:5px;overflow:hidden
}
.fill{height:100%;transition:width .15s}
#healthFill{background:#e53935}
#shieldFill{background:#2196f3}
#stats{font-size:17px;margin-top:10px}

#weapon{
 position:fixed;right:20px;bottom:20px;color:white;text-align:right;
 z-index:20;text-shadow:2px 2px 4px #000
}
#weaponName{font-size:28px;font-weight:bold}
#ammo{font-size:22px}

#build{
 position:fixed;right:20px;top:20px;color:white;text-align:right;
 z-index:20;text-shadow:2px 2px 4px #000
}
#message{
 position:fixed;left:50%;top:15%;transform:translateX(-50%);
 color:white;font-size:30px;font-weight:bold;z-index:30;
 text-shadow:3px 3px 5px #000;pointer-events:none
}
#minimap{
 position:fixed;right:20px;top:90px;width:180px;height:180px;
 border:3px solid white;border-radius:50%;background:rgba(20,80,40,.65);
 z-index:15;overflow:hidden
}
#mapCanvas{width:100%;height:100%}

#start{
 position:fixed;inset:0;background:linear-gradient(#158bd6,#62c8ff);
 z-index:100;display:flex;align-items:center;justify-content:center;
 flex-direction:column;color:white;text-align:center
}
#start h1{
 font-size:70px;margin:0 0 5px;text-shadow:5px 5px 0 #245;
}
#start h2{margin:0 0 30px;font-size:25px}
#start button{
 padding:18px 55px;border:0;border-radius:10px;
 background:#ffb300;color:#fff;font-size:25px;font-weight:bold;
 cursor:pointer;box-shadow:0 5px 0 #b87500
}
#start button:hover{filter:brightness(1.1)}

#damageFlash{
 position:fixed;inset:0;background:rgba(255,0,0,.25);
 z-index:25;pointer-events:none;opacity:0
}
</style>
</head>
<body>

<div id="start">
<h1>BATTLE ISLAND</h1>
<h2>3D BUILD • SHOOT • SURVIVE</h2>
<button id="startBtn">DROP INTO THE ISLAND</button>
<p>WASD • Mouse • Click • Space • Q/F/G • 1/2/3</p>
</div>

<div id="crosshair"></div>
<div id="damageFlash"></div>

<div id="hud">
<div>❤️ HEALTH</div>
<div class="bar"><div id="healthFill" class="fill" style="width:100%"></div></div>
<div>🛡️ SHIELD</div>
<div class="bar"><div id="shieldFill" class="fill" style="width:100%"></div></div>
<div id="stats">ELIMINATIONS: 0 &nbsp; | &nbsp; MATERIALS: 300</div>
</div>

<div id="weapon">
<div id="weaponName">ASSAULT RIFLE</div>
<div id="ammo">30 / 120</div>
</div>

<div id="build">
<b>BUILD</b><br>
Q — WALL<br>
F — FLOOR<br>
G — RAMP<br>
Materials: <span id="mats">300</span>
</div>

<div id="message"></div>

<div id="minimap">
<canvas id="mapCanvas" width="180" height="180"></canvas>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

import {PointerLockControls} from
'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/PointerLockControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x83d7ff);
scene.fog = new THREE.Fog(0x83d7ff,80,500);

const camera = new THREE.PerspectiveCamera(
75,innerWidth/innerHeight,.1,1000
);
camera.position.set(0,5,20);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls=new PointerLockControls(camera,document.body);
scene.add(controls.getObject());

/* LIGHTING */
const hemi=new THREE.HemisphereLight(0x9edcff,0x386b28,2.0);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(100,180,80);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-250;
sun.shadow.camera.right=250;
sun.shadow.camera.top=250;
sun.shadow.camera.bottom=-250;
scene.add(sun);

/* WORLD */
const worldSize=500;

const groundMat=new THREE.MeshStandardMaterial({
 color:0x4d9a42,roughness:1
});
const ground=new THREE.Mesh(
 new THREE.BoxGeometry(worldSize,8,worldSize),
 groundMat
);
ground.position.y=-4;
ground.receiveShadow=true;
scene.add(ground);

/* water */
const water=new THREE.Mesh(
 new THREE.CircleGeometry(260,64),
 new THREE.MeshStandardMaterial({
  color:0x188dcc,transparent:true,opacity:.65,
  roughness:.2,metalness:.1
 })
);
water.rotation.x=-Math.PI/2;
water.position.y=-.02;
scene.add(water);

/* trees */
const trees=[];

function makeTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.65,.9,7,8),
  new THREE.MeshStandardMaterial({color:0x75452b})
 );
 trunk.position.y=3.5;
 trunk.castShadow=true;

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(4.2,9,9),
  new THREE.MeshStandardMaterial({color:0x176b32})
 );
 leaves.position.y=9;
 leaves.castShadow=true;

 group.add(trunk,leaves);
 group.position.set(x,0,z);
 scene.add(group);
 trees.push(group);
}

for(let i=0;i<90;i++){
 let x=(Math.random()-.5)*430;
 let z=(Math.random()-.5)*430;

 if(Math.abs(x)<45 && Math.abs(z)<45) continue;
 makeTree(x,z);
}

/* rocks */
function makeRock(x,z,s){
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(s,1),
  new THREE.MeshStandardMaterial({color:0x777777,roughness:1})
 );
 rock.position.set(x,s*.6,z);
 rock.rotation.set(Math.random(),Math.random(),Math.random());
 rock.castShadow=true;
 scene.add(rock);
}
for(let i=0;i<60;i++){
 makeRock((Math.random()-.5)*430,(Math.random()-.5)*430,
 Math.random()*2+1);
}

/* BUILDINGS */
const buildings=[];

function makeBuilding(x,z,w,d,h){
 const group=new THREE.Group();

 const wallMat=new THREE.MeshStandardMaterial({
  color:new THREE.Color().setHSL(Math.random(),.45,.48)
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),wallMat
 );
 body.position.y=h/2;
 body.castShadow=true;
 body.receiveShadow=true;

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(w+1,1,d+1),
  new THREE.MeshStandardMaterial({color:0x343b45})
 );
 roof.position.y=h+.5;
 roof.castShadow=true;

 group.add(body,roof);
 group.position.set(x,0,z);
 scene.add(group);
 buildings.push(group);
}

makeBuilding(-60,-45,24,18,14);
makeBuilding(70,-55,30,20,18);
makeBuilding(-90,70,22,22,11);
makeBuilding(65,75,28,18,15);
makeBuilding(0,-100,36,24,20);

/* roads */
const roadMat=new THREE.MeshStandardMaterial({color:0x454545});
function road(x,z,w,d){
 const r=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),roadMat);
 r.position.set(x,.06,z);
 scene.add(r);
}
road(0,0,500,13);
road(0,0,13,500);

/* loot */
const loot=[];
function makeLoot(x,z){
 const box=new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshStandardMaterial({
   color:0xffc107,emissive:0x553300
  })
 );
 box.position.set(x,1,z);
 box.castShadow=true;
 scene.add(box);
 loot.push(box);
}
for(let i=0;i<25;i++)
 makeLoot((Math.random()-.5)*380,(Math.random()-.5)*380);

/* PLAYER */
const player={
 health:100,
 shield:100,
 materials:300,
 eliminations:0,
 speed:10,
 sprint:17,
 height:3
};

controls.getObject().position.set(0,3,30);

/* WEAPONS */
const weapons=[
 {name:"ASSAULT RIFLE",mag:30,ammo:120,damage:25,rate:110,reload:1200},
 {name:"SHOTGUN",mag:8,ammo:40,damage:15,rate:650,reload:1300},
 {name:"SMG",mag:40,ammo:180,damage:13,rate:75,reload:1100}
];

let weaponIndex=0;
let current=weapons[0];
let shooting=false;
let lastShot=0;
let reloading=false;

/* GUN */
const gun=new THREE.Group();
camera.add(gun);

const gunBody=new THREE.Mesh(
 new THREE.BoxGeometry(.45,.45,2.5),
 new THREE.MeshStandardMaterial({color:0x252525})
);
gunBody.position.set(.7,-.55,-1.5);

const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(.11,.11,1.2,12),
 new THREE.MeshStandardMaterial({color:0x111111})
);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.7,-.52,-2.8);

const grip=new THREE.Mesh(
 new THREE.BoxGeometry(.28,.65,.4),
 new THREE.MeshStandardMaterial({color:0x202020})
);
grip.position.set(.7,-.9,-1.1);
grip.rotation.x=-.25;

gun.add(gunBody,barrel,grip);

/* ENEMIES */
const enemies=[];
const enemyMat=new THREE.MeshStandardMaterial({color:0xe53935});

function makeEnemy(x,z){
 const enemy=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,3.2,1.4),enemyMat
 );
 body.position.y=2.3;
 body.castShadow=true;

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(1,16,12),
  new THREE.MeshStandardMaterial({color:0xffc49b})
 );
 head.position.y=4.7;
 head.castShadow=true;

 const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});

 const eye1=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),eyeMat);
 const eye2=eye1.clone();
 eye1.position.set(-.35,4.85,-.88);
 eye2.position.set(.35,4.85,-.88);

 enemy.add(body,head,eye1,eye2);
 enemy.position.set(x,0,z);

 enemy.userData={
  health:100,
  speed:2.2+Math.random()*1.5,
  attack:0
 };

 scene.add(enemy);
 enemies.push(enemy);
}

for(let i=0;i<16;i++){
 let x=(Math.random()-.5)*300;
 let z=(Math.random()-.5)*300;
 if(Math.hypot(x,z)<50){i--;continue}
 makeEnemy(x,z);
}

/* STORM */
let stormRadius=240;
const stormRing=new THREE.Mesh(
 new THREE.RingGeometry(stormRadius-.8,stormRadius,128),
 new THREE.MeshBasicMaterial({
  color:0x8e44ff,side:THREE.DoubleSide,
  transparent:true,opacity:.8
 })
);
stormRing.rotation.x=-Math.PI/2;
stormRing.position.y=.15;
scene.add(stormRing);

/* PARTICLES */
const particles=[];

function explosion(pos){
 for(let i=0;i<14;i++){
  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.09,6,6),
   new THREE.MeshBasicMaterial({color:0xffd000})
  );
  p.position.copy(pos);
  p.userData.vel=new THREE.Vector3(
   (Math.random()-.5)*7,
   Math.random()*7,
   (Math.random()-.5)*7
  );
  scene.add(p);
  particles.push({mesh:p,life:1});
 }
}

/* INPUT */
const keys={};
document.addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="Digit1")switchWeapon(0);
 if(e.code==="Digit2")switchWeapon(1);
 if(e.code==="Digit3")switchWeapon(2);

 if(e.code==="KeyR")reload();

 if(e.code==="KeyQ")build("wall");
 if(e.code==="KeyF")build("floor");
 if(e.code==="KeyG")build("ramp");
});
document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousedown",e=>{
 if(e.button===0){
  shooting=true;
  shoot();
 }
});
document.addEventListener("mouseup",e=>{
 if(e.button===0)shooting=false;
});

/* WEAPON SWITCH */
function switchWeapon(i){
 weaponIndex=i;
 current=weapons[i];
 reloading=false;
 updateWeaponUI();
}

function updateWeaponUI(){
 document.getElementById("weaponName").textContent=current.name;
 document.getElementById("ammo").textContent=
 current.mag+" / "+current.ammo;
}

/* RELOAD */
function reload(){
 if(reloading || current.mag>=
 getMaxMag())return;
 if(current.ammo<=0)return;

 reloading=true;
 showMessage("RELOADING...",500);

 setTimeout(()=>{
  const needed=getMaxMag()-current.mag;
  const amount=Math.min(needed,current.ammo);
  current.mag+=amount;
  current.ammo-=amount;
  reloading=false;
  updateWeaponUI();
 },current.reload);
}

function getMaxMag(){
 return weaponIndex===0?30:weaponIndex===1?8:40;
}

/* SHOOT */
const raycaster=new THREE.Raycaster();

function shoot(){
 if(reloading)return;

 const now=performance.now();
 if(now-lastShot<current.rate)return;
 lastShot=now;

 if(current.mag<=0){
  reload();
  return;
 }

 current.mag--;
 updateWeaponUI();

 const direction=new THREE.Vector3();
 camera.getWorldDirection(direction);

 raycaster.set(camera.position,direction);

 const targets=enemies.flatMap(e=>e.children);
 const hits=raycaster.intersectObjects(targets,false);

 if(hits.length){
  const hit=hits[0].object;
  const enemy=hit.parent;
  if(enemies.includes(enemy)){
   let damage=current.damage;
   if(hit.position.y>4)damage*=2;

   enemy.userData.health-=damage;
   explosion(hits[0].point);

   if(enemy.userData.health<=0){
    killEnemy(enemy);
   }
  }
 }
}

/* KILL */
function killEnemy(enemy){
 player.eliminations++;
 player.materials+=25;

 const index=enemies.indexOf(enemy);
 if(index>=0)enemies.splice(index,1);

 scene.remove(enemy);

 showMessage("ELIMINATION +25",700);
 updateHUD();
}

/* BUILDING */
const builds=[];

function build(type){
 if(player.materials<10){
  showMessage("NOT ENOUGH MATERIALS",700);
  return;
 }

 const pos=controls.getObject().position.clone();

 const forward=new THREE.Vector3();
 camera.getWorldDirection(forward);
 forward.y=0;
 forward.normalize();

 const buildPos=pos.clone().add(forward.multiplyScalar(6));
 buildPos.y=type==="floor"?0:2;

 let mesh;

 const mat=new THREE.MeshStandardMaterial({
  color:0x49a7ff,
  transparent:true,
  opacity:.88
 });

 if(type==="wall"){
  mesh=new THREE.Mesh(new THREE.BoxGeometry(6,5,0.35),mat);
  mesh.position.copy(buildPos);
  mesh.rotation.y=Math.atan2(forward.x,forward.z);
 }
 else if(type==="floor"){
  mesh=new THREE.Mesh(new THREE.BoxGeometry(6,.3,6),mat);
  mesh.position.copy(buildPos);
  mesh.position.y=1;
 }
 else{
  mesh=new THREE.Mesh(new THREE.BoxGeometry(7,.4,7),mat);
  mesh.position.copy(buildPos);
  mesh.position.y=1;
  mesh.rotation.z=.5;
 }

 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 builds.push(mesh);

 player.materials-=10;
 updateHUD();
}

/* ENEMY AI */
function enemyAI(dt){
 const pp=controls.getObject().position;

 for(const enemy of enemies){
  const ep=enemy.position;
  const dist=ep.distanceTo(pp);

  if(dist<80){
   const dir=new THREE.Vector3(
    pp.x-ep.x,0,pp.z-ep.z
   ).normalize();

   if(dist>9){
    ep.addScaledVector(dir,enemy.userData.speed*dt);
   }else{
    enemy.userData.attack-=dt;
    if(enemy.userData.attack<=0){
     damagePlayer(7);
     enemy.userData.attack=1.1;
    }
   }

   enemy.lookAt(pp.x,enemy.position.y,pp.z);
  }
 }
}

/* PLAYER DAMAGE */
function damagePlayer(amount){
 if(player.shield>0){
  const absorbed=Math.min(player.shield,amount);
  player.shield-=absorbed;
  amount-=absorbed;
 }

 player.health-=amount;

 const flash=document.getElementById("damageFlash");
 flash.style.opacity=1;
 setTimeout(()=>flash.style.opacity=0,100);

 updateHUD();

 if(player.health<=0)gameOver();
}

/* LOOT */
function lootCheck(){
 const pp=controls.getObject().position;

 for(let i=loot.length-1;i>=0;i--){
  if(loot[i].position.distanceTo(pp)<4){
   const item=loot[i];
   scene.remove(item);
   loot.splice(i,1);

   if(Math.random()<.5){
    player.shield=Math.min(100,player.shield+30);
    showMessage("SHIELD +30",600);
   }else{
    player.materials+=30;
    showMessage("MATERIALS +30",600);
   }
   updateHUD();
  }
 }
}

/* STORM */
let stormTimer=0;

function updateStorm(dt){
 stormTimer+=dt;

 if(stormTimer>5){
  stormTimer=0;
  stormRadius=Math.max(45,stormRadius-1);
  stormRing.geometry.dispose();
  stormRing.geometry=new THREE.RingGeometry(
   stormRadius-.8,stormRadius,128
  );
 }

 const p=controls.getObject().position;
 const d=Math.hypot(p.x,p.z);

 if(d>stormRadius){
  damagePlayer(2.5*dt);
 }
}

/* MOVEMENT */
function movement(dt){
 const speed=keys.ShiftLeft||keys.ShiftRight?
 player.sprint:player.speed;

 if(keys.KeyW)controls.moveForward(speed*dt);
 if(keys.KeyS)controls.moveForward(-speed*dt);
 if(keys.KeyA)controls.moveRight(-speed*dt);
 if(keys.KeyD)controls.moveRight(speed*dt);

 const obj=controls.getObject();

 obj.position.x=Math.max(-240,Math.min(240,obj.position.x));
 obj.position.z=Math.max(-240,Math.min(240,obj.position.z));

 if(keys.Space && obj.position.y<=3.01){
  obj.position.y=8;
 }
 obj.position.y-=18*dt;

 if(obj.position.y<3)obj.position.y=3;
}

/* UI */
function updateHUD(){
 document.getElementById("healthFill").style.width=
 Math.max(0,player.health)+"%";

 document.getElementById("shieldFill").style.width=
 Math.max(0,player.shield)+"%";

 document.getElementById("stats").textContent=
 "ELIMINATIONS: "+player.eliminations+
 "  |  MATERIALS: "+player.materials;

 document.getElementById("mats").textContent=player.materials;
 updateWeaponUI();
}

function showMessage(text,time=800){
 const m=document.getElementById("message");
 m.textContent=text;
 clearTimeout(m.timer);
 m.timer=setTimeout(()=>m.textContent="",time);
}

function gameOver(){
 controls.unlock();
 document.getElementById("start").style.display="flex";
 document.getElementById("start").innerHTML=
 `<h1>YOU WERE ELIMINATED</h1>
  <h2>Eliminations: ${player.eliminations}</h2>
  <button onclick="location.reload()">PLAY AGAIN</button>`;
}

/* MINIMAP */
const mapCanvas=document.getElementById("mapCanvas");
const ctx=mapCanvas.getContext("2d");

function drawMap(){
 ctx.clearRect(0,0,180,180);

 ctx.fillStyle="#39823a";
 ctx.fillRect(0,0,180,180);

 ctx.strokeStyle="rgba(255,255,255,.3)";
 for(let i=0;i<180;i+=30){
  ctx.beginPath();
  ctx.moveTo(i,0);ctx.lineTo(i,180);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,i);ctx.lineTo(180,i);ctx.stroke();
 }

 const p=controls.getObject().position;

 function mapX(x){return (x+250)/500*180}
 function mapZ(z){return (z+250)/500*180}

 ctx.strokeStyle="#b26cff";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.arc(
 90,90,
  stormRadius/500*180,
  0,Math.PI*2
 );
 ctx.stroke();

 ctx.fillStyle="#ff3333";
 for(const e of enemies){
  ctx.beginPath();
  ctx.arc(mapX(e.position.x),mapZ(e.position.z),3,0,Math.PI*2);
  ctx.fill();
 }

 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(mapX(p.x),mapZ(p.z),4,0,Math.PI*2);
 ctx.fill();
}

/* PARTICLES */
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.life-=dt;
  p.mesh.position.addScaledVector(p.mesh.userData.vel,dt);
  p.mesh.userData.vel.y-=12*dt;

  if(p.life<=0){
   scene.remove(p.mesh);
   particles.splice(i,1);
  }
 }
}

/* GAME LOOP */
let last=performance.now();

function animate(){
 requestAnimationFrame(animate);

 const now=performance.now();
 const dt=Math.min(.05,(now-last)/1000);
 last=now;

 if(controls.isLocked){
  movement(dt);
  enemyAI(dt);
  lootCheck();
  updateStorm(dt);
  updateParticles(dt);

  if(shooting)shoot();
  drawMap();

  gun.position.y=Math.sin(now*.006)*.025;
 }

 renderer.render(scene,camera);
}

animate();

/* START */
document.getElementById("startBtn").onclick=()=>{
 document.getElementById("start").style.display="none";
 controls.lock();
};

controls.addEventListener("lock",()=>{
 document.getElementById("start").style.display="none";
});

controls.addEventListener("unlock",()=>{
 if(player.health>0)
  document.getElementById("start").style.display="flex";
});

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updateHUD();
</script>
</body>
</html>
